name: Deploy frontend to Vercel

on:
  workflow_run:
    workflows: [Frontend quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name == 'workflow_run' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.VERCEL_ACTIONS_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_run' && 'vercel-production' || 'vercel-preview' }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_run' && 'production' || 'preview' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '66.6.0'
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require latest main commit before checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$latest_sha" ]]; then
            echo '::error::This commit is no longer main HEAD; no deployment was started.'
            exit 1
          fi
          : "${VERCEL_ORG_ID:?Set the environment VERCEL_ORG_ID variable}"
          : "${VERCEL_PROJECT_ID:?Set the environment VERCEL_PROJECT_ID variable}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.29.1
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Pull target environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the environment VERCEL_TOKEN secret}"
          vercel pull --yes --environment="$DEPLOY_TARGET" --local-config=config/vercel.ci.json

      - name: Build deployment output
        run: |
          set -euo pipefail
          flags=()
          if [[ "$DEPLOY_TARGET" == 'production' ]]; then flags+=(--prod); fi
          vercel build "${flags[@]}" --local-config=config/vercel.ci.json

      - name: Recheck latest main and deploy prebuilt output
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$latest_sha" ]]; then
            echo '::error::main changed during the build; refusing to deploy stale output.'
            exit 1
          fi
          flags=()
          if [[ "$DEPLOY_TARGET" == 'production' ]]; then flags+=(--prod); fi
          deployment_url="$(vercel deploy --prebuilt --yes "${flags[@]}" --local-config=config/vercel.ci.json)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          {
            printf '### Vercel deployment\n\n'
            printf -- '- Target: `%s`\n' "$DEPLOY_TARGET"
            printf -- '- Commit: `%s`\n' "$DEPLOY_SHA"
            printf -- '- URL: %s\n' "$deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove pulled environment and build output
        if: ${{ always() }}
        run: rm -rf -- .vercel
